[package]
name = "procmail-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
procmail-rs = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "rc"
path = "fuzz_targets/rc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shell-expression"
path = "fuzz_targets/shell_expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shell-pattern"
path = "fuzz_targets/shell_pattern.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shell-condition"
path = "fuzz_targets/shell_condition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "regex"
path = "fuzz_targets/regex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header-edit"
path = "fuzz_targets/header_edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ordered-evaluation"
path = "fuzz_targets/ordered_evaluation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "destination-path"
path = "fuzz_targets/destination_path.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
