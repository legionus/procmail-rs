[package]
name = "procmail-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
procmail-rs = { path = ".." }

[[bin]]
name = "rc"
path = "fuzz_targets/rc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
